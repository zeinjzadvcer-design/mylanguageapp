services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ascension
      POSTGRES_PASSWORD: ascension
      POSTGRES_DB: ascension
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ascension -d ascension']
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis. Not optional once AI is in use: the AI quota counter fails CLOSED
  # when Redis is unavailable — deliberately, so a cache outage cannot hand out
  # unlimited paid AI — which means every AI feature is refused without it.
  # Caching and rate limiting also fall back to per-process without it.
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for audio recordings. Cloudflare R2 or
  # DigitalOcean Spaces in production; the API only ever speaks the S3 API, so
  # switching is an endpoint and a key pair.
  #
  # SeaweedFS, not MinIO: MinIO now gates every image tag behind authentication.
  storage:
    image: docker.io/chrislusf/seaweedfs:latest
    command: >
      server -dir=/data -ip=storage -ip.bind=0.0.0.0
      -master.port=9333 -volume.port=8080 -filer -filer.port=8888
      -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
      -s3.autoCreateBucket -s3.allowedOrigins='*'
    ports:
      - '9000:9000'
    volumes:
      - storage-data:/data
      - ./scripts/seaweed-s3-config.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:9333/cluster/healthz']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the bucket up front so the API's startup check succeeds.
  storage-init:
    image: docker.io/chrislusf/seaweedfs:latest
    depends_on:
      storage:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      echo 's3.bucket.create -name ascension-media' | weed shell -master=storage:9333 &&
      echo 'Bucket ready.'
      "

  # One-shot: creates/updates the schema, then exits. The api service waits
  # for it to finish successfully before starting.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://ascension:ascension@db:5432/ascension
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    volumes:
      # Pick up schema and SQL migration edits without rebuilding the image.
      - ./artifacts/api-server/migrations:/app/artifacts/api-server/migrations
      - ./lib/db/src:/app/lib/db/src
      - ./scripts/migrate.mjs:/app/scripts/migrate.mjs

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://ascension:ascension@db:5432/ascension
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-insecure-secret}
      NODE_ENV: development
      PORT: '8080'
      LOG_LEVEL: info
      TRUST_PROXY: '1'
      JOB_QUEUE: ${JOB_QUEUE:-memory}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-4}
      JOB_ATTEMPTS: ${JOB_ATTEMPTS:-2}
      JOB_WORKER: ${JOB_WORKER:-}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-15000}
      REDIS_URL: redis://redis:6379
      # Encrypts API keys stored by the AI settings panel. Dev-only value —
      # generate a real one for any deployment: openssl rand -hex 32
      AI_CONFIG_SECRET: ${AI_CONFIG_SECRET:-dev-only-insecure-ai-config-secret-change-me}
      # The first administrator, created on start if no administrator exists.
      # Read from the root .env (copy .env.example), so a deployment changes the
      # values there rather than anything in the code.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin@1234}
      # Media storage (MinIO locally). Path-style addressing is required:
      # MinIO does not serve buckets as subdomains.
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: ascension-media
      STORAGE_ACCESS_KEY_ID: ascension
      STORAGE_SECRET_ACCESS_KEY: ascension-dev-secret
      STORAGE_FORCE_PATH_STYLE: 'true'
      # The browser reaches storage directly, not over the compose network, so
      # presigned URLs must be SIGNED for an address it can resolve — SigV4
      # signs the Host header, so rewriting the URL afterwards breaks it.
      # Override in .env wherever the browser does not reach the host as
      # localhost.
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      # Where a password-reset link should point: the address students use.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}

      # ── Everything below is passed through from .env ──────────────────────
      # This block is an ALLOWLIST: a variable absent here is ignored however
      # carefully it is set in .env, and nothing reports that. Each group below
      # was previously unreachable, which pinned it to its code default —
      # silently, because the defaults happened to match .env.
      # See docs/features/peer-calls-deployment-checklist.md #1.

      # TURN/STUN. Without these a relay cannot be switched on at all, and
      # roughly 10-20% of calls (symmetric NAT, mobile CGNAT, school
      # firewalls) cannot connect at all.
      PRACTICE_STUN_URLS: ${PRACTICE_STUN_URLS:-}
      PRACTICE_TURN_URLS: ${PRACTICE_TURN_URLS:-}
      PRACTICE_TURN_USERNAME: ${PRACTICE_TURN_USERNAME:-}
      PRACTICE_TURN_CREDENTIAL: ${PRACTICE_TURN_CREDENTIAL:-}

      # Call bounds. MAX_CALL_MINUTES is a cost lever, not just a courtesy:
      # it decides ASR minutes per evaluated call.
      PRACTICE_MAX_CALL_MINUTES: ${PRACTICE_MAX_CALL_MINUTES:-15}
      PRACTICE_DAILY_CALL_LIMIT: ${PRACTICE_DAILY_CALL_LIMIT:-20}
      PRACTICE_RING_TIMEOUT_MS: ${PRACTICE_RING_TIMEOUT_MS:-45000}
      PRACTICE_CONNECT_TIMEOUT_MS: ${PRACTICE_CONNECT_TIMEOUT_MS:-30000}
      # How long both sides must be silent before a live call is abandoned, and
      # how often to look. A crashed tab otherwise locks both students out.
      PRACTICE_ABANDONED_AFTER_MS: ${PRACTICE_ABANDONED_AFTER_MS:-30000}
      PRACTICE_SWEEP_INTERVAL_MS: ${PRACTICE_SWEEP_INTERVAL_MS:-15000}

      # Rate limits. A call polls two endpoints every second, so these have to
      # be raisable without a rebuild.
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_API: ${RATE_LIMIT_API:-1000}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-20}
      RATE_LIMIT_PRACTICE_POLL: ${RATE_LIMIT_PRACTICE_POLL:-2400}

      # AI timeouts and retries. AI_ASR_POLL_TIMEOUT_MS matters most: the code
      # default of 3 minutes was sized for a 30-second read-aloud, not a
      # 15-minute multichannel call.
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-30000}
      AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-3}
      AI_ASR_TIMEOUT_MS: ${AI_ASR_TIMEOUT_MS:-60000}
      AI_ASR_POLL_TIMEOUT_MS: ${AI_ASR_POLL_TIMEOUT_MS:-600000}

      # Grading sweeper. While JOB_QUEUE=memory this is the ONLY recovery path
      # for a job lost to a restart, so the interval is not a free knob.
      GRADING_SWEEP_ENABLED: ${GRADING_SWEEP_ENABLED:-true}
      GRADING_SWEEP_INTERVAL_MS: ${GRADING_SWEEP_INTERVAL_MS:-600000}
      GRADING_SWEEP_STALE_MS: ${GRADING_SWEEP_STALE_MS:-300000}
      GRADING_SWEEP_MAX_ATTEMPTS: ${GRADING_SWEEP_MAX_ATTEMPTS:-3}
      GRADING_SWEEP_BATCH: ${GRADING_SWEEP_BATCH:-20}

      # Shared counter for lesson recordings and call recordings alike.
      MEDIA_DAILY_UPLOAD_LIMIT: ${MEDIA_DAILY_UPLOAD_LIMIT:-200}
      # Attempts allowed per block per lesson. Passive blocks are exempt.
      MAX_BLOCK_ATTEMPTS: ${MAX_BLOCK_ATTEMPTS:-3}

      # Swagger UI. Off unless set — explicit rather than merely absent.
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-}

      # Connection pool. Sized per process, so it multiplies by instance count
      # on a platform that runs more than one.
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}

      # Password-reset delivery. Unset means nothing is sent: the message goes
      # to the log, and outside production the reset endpoint also returns the
      # link so development can continue.
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_TIMEOUT_MS: ${MAIL_TIMEOUT_MS:-10000}
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    environment:
      PORT: '5173'
      BASE_PATH: /
      # The app calls relative /api paths; Vite proxies them to the api service.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8080}
      # Host file events do not reach the container through a bind mount on
      # Windows/macOS; poll instead so hot reload works.
      VITE_USE_POLLING: '1'
    ports:
      - '5173:5173'
    depends_on:
      - api
    volumes:
      # Live-reload the frontend source without rebuilding the image.
      # node_modules stay inside the container (Linux binaries).
      - ./artifacts/ascension/src:/app/artifacts/ascension/src
      # The generated API client too: regenerating it on the host (pnpm
      # --filter @workspace/api-spec codegen) otherwise leaves the container on
      # the copy baked into the image, and the app fails to load with
      # "does not provide an export named ..." for every newly generated hook.
      # Only src is mounted, so the container keeps its own node_modules.
      - ./lib/api-client-react/src:/app/lib/api-client-react/src
      - ./attached_assets:/app/attached_assets

volumes:
  db-data:
  storage-data:
