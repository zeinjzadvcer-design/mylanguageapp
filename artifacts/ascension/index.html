    <script>
      // Set the language and direction before first paint so an English
      // visitor never sees the page flash right-to-left. Keep the key in
      // sync with LANG_STORAGE_KEY in src/lib/i18n.tsx.
      try {
        var l = localStorage.getItem('enstep.lang');
        if (l === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
      } catch (e) {}
    </script>
