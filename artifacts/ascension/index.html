<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Full URLs (a reset link carries its token) never go to other sites. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      Clickjacking guard. Another site could load the app in an invisible frame
      and trick a student into clicking. The X-Frame-Options header would stop
      that, but a static host (DigitalOcean App Platform) cannot send headers —
      so the page starts hidden, and only shows itself as the top window.
      Framed with scripts blocked, it stays hidden; the app is JavaScript, so
      there is nothing to click either way.
    -->
    <style id="frame-guard">html { display: none !important; }</style>
    <script>
      if (window.self === window.top) {
        document.getElementById('frame-guard').remove();
      } else {
        try { window.top.location = window.self.location; } catch (e) {}
      }
    </script>
    <title>EnStep — English step by step</title>
    <meta name="description" content="EnStep: تحدث الإنجليزية بثقة، خطوة بخطوة. منصة تعليم الإنجليزية المصممة خصيصاً للمتعلم العربي." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FBF8F1" />
    <meta property="og:title" content="EnStep — English step by step" />
    <meta property="og:description" content="EnStep: تحدث الإنجليزية بثقة، خطوة بخطوة. منصة تعليم الإنجليزية المصممة خصيصاً للمتعلم العربي." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EnStep — English step by step" />
    <meta name="twitter:description" content="EnStep: تحدث الإنجليزية بثقة، خطوة بخطوة. منصة تعليم الإنجليزية المصممة خصيصاً للمتعلم العربي." />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      // Set the language and direction before first paint so an English
      // visitor never sees the page flash right-to-left. Keep the key in
      // sync with LANG_STORAGE_KEY in src/lib/i18n.tsx.
      try {
        var l = localStorage.getItem('enstep.lang');
        if (l === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
