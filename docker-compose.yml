services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ascension
      POSTGRES_PASSWORD: ascension
      POSTGRES_DB: ascension
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ascension -d ascension']
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis. Not optional once AI is in use: the AI quota counter fails CLOSED
  # when Redis is unavailable — deliberately, so a cache outage cannot hand out
  # unlimited paid AI — which means every AI feature is refused without it.
  # Caching and rate limiting also fall back to per-process without it.
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    # 6380 on the host, not 6379. The API reaches Redis by service name over
    # the compose network, so this mapping exists only for local tooling —
    # and 6379 is contested often enough on a developer machine (another
    # project's container, a system redis) that claiming it costs more than
    # it is worth. Connect from the host with `redis-cli -p 6380`.
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for audio recordings. Cloudflare R2 or
  # DigitalOcean Spaces in production; the API only ever speaks the S3 API, so
  # switching is an endpoint and a key pair.
  #
  # SeaweedFS, not MinIO: MinIO now gates every image tag behind authentication.
  storage:
    image: docker.io/chrislusf/seaweedfs:latest
    command: >
      server -dir=/data -ip=storage -ip.bind=0.0.0.0
      -master.port=9333 -volume.port=8080 -filer -filer.port=8888
      -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
      -s3.autoCreateBucket -s3.allowedOrigins='*'
    ports:
      - '9000:9000'
    volumes:
      - storage-data:/data
      - ./scripts/seaweed-s3-config.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:9333/cluster/healthz']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the bucket up front so the API's startup check succeeds.
  storage-init:
    image: docker.io/chrislusf/seaweedfs:latest
    depends_on:
      storage:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      echo 's3.bucket.create -name ascension-media' | weed shell -master=storage:9333 &&
      echo 'Bucket ready.'
      "

  # One-shot: creates/updates the schema, then exits. The api service waits
  # for it to finish successfully before starting.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://ascension:ascension@db:5432/ascension
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    volumes:
      # Pick up schema and SQL migration edits without rebuilding the image.
      - ./artifacts/api-server/migrations:/app/artifacts/api-server/migrations
      - ./lib/db/src:/app/lib/db/src
      - ./scripts/migrate.mjs:/app/scripts/migrate.mjs

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://ascension:ascension@db:5432/ascension
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-insecure-secret}
      NODE_ENV: development
      PORT: '8080'
      LOG_LEVEL: info
      TRUST_PROXY: '1'
      JOB_QUEUE: memory
      REDIS_URL: redis://redis:6379
      # Encrypts API keys stored by the AI settings panel. Dev-only value —
      # generate a real one for any deployment: openssl rand -hex 32
      AI_CONFIG_SECRET: ${AI_CONFIG_SECRET:-dev-only-insecure-ai-config-secret-change-me}
      # The first administrator, created on start if no administrator exists.
      # Read from the root .env (copy .env.example), so a deployment changes the
      # values there rather than anything in the code.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin@1234}
      # Media storage (MinIO locally). Path-style addressing is required:
      # MinIO does not serve buckets as subdomains.
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: ascension-media
      STORAGE_ACCESS_KEY_ID: ascension
      STORAGE_SECRET_ACCESS_KEY: ascension-dev-secret
      STORAGE_FORCE_PATH_STYLE: 'true'
      # The browser reaches storage directly, not over the compose network, so
      # presigned URLs must be SIGNED for an address it can resolve — SigV4
      # signs the Host header, so rewriting the URL afterwards breaks it.
      # Override in .env wherever the browser does not reach the host as
      # localhost.
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      # Where a password-reset link should point: the address students use.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      # USDT (BEP-20) payments. Off unless the root .env switches them on —
      # see .env.example for what each value does and why the wallet address
      # is deploy configuration rather than an admin setting.
      CRYPTO_PAYMENTS_ENABLED: ${CRYPTO_PAYMENTS_ENABLED:-false}
      BSC_USDT_WALLET_ADDRESS: ${BSC_USDT_WALLET_ADDRESS:-}
      BSC_RPC_URL: ${BSC_RPC_URL:-https://bsc-dataseed.binance.org}
      BSC_RPC_URL_FALLBACK: ${BSC_RPC_URL_FALLBACK:-https://bsc-dataseed1.defibit.io}
      BSC_CONFIRMATIONS: ${BSC_CONFIRMATIONS:-15}
      CRYPTO_AMOUNT_TOLERANCE_PCT: ${CRYPTO_AMOUNT_TOLERANCE_PCT:-2}
      CRYPTO_TXID_MAX_AGE_DAYS: ${CRYPTO_TXID_MAX_AGE_DAYS:-7}
      CRYPTO_VERIFY_INTERVAL_MS: ${CRYPTO_VERIFY_INTERVAL_MS:-60000}
      CRYPTO_VERIFY_MAX_ATTEMPTS: ${CRYPTO_VERIFY_MAX_ATTEMPTS:-8}
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    environment:
      PORT: '5173'
      BASE_PATH: /
      # The app calls relative /api paths; Vite proxies them to the api service.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8080}
      # Host file events do not reach the container through a bind mount on
      # Windows/macOS; poll instead so hot reload works.
      VITE_USE_POLLING: '1'
    ports:
      - '5173:5173'
    depends_on:
      - api
    volumes:
      # Live-reload the frontend source without rebuilding the image.
      # node_modules stay inside the container (Linux binaries).
      - ./artifacts/ascension/src:/app/artifacts/ascension/src
      # The generated API client too: regenerating it on the host (pnpm
      # --filter @workspace/api-spec codegen) otherwise leaves the container on
      # the copy baked into the image, and the app fails to load with
      # "does not provide an export named ..." for every newly generated hook.
      # Only src is mounted, so the container keeps its own node_modules.
      - ./lib/api-client-react/src:/app/lib/api-client-react/src
      - ./attached_assets:/app/attached_assets

volumes:
  db-data:
  storage-data:
